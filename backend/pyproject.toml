[project]
name = "resumex-analyzer"
version = "0.1.0"
description = "Multi-agent resume analyzer powered by Gemini + LangGraph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
    "google-genai>=2.0",
    "google-generativeai>=0.8",
    "langgraph>=0.2",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
dev-dependencies = ["pytest>=9.1.1", "pygments>=2.20.0"]
